[metadata]
name = linkedin-job-monitor-skill
version = 0.5.0
description = Reusable Codex skill for profile-driven LinkedIn job monitoring
license = MIT

[options]
python_requires = >=3.9
package_dir =
    = linkedin-job-monitor/scripts
py_modules =
    apply_filters
    collect_profile
    config_schema
    dedupe_jobs
    feedback_learning
    monitor_tasks
    fetch_career_jobs
    fetch_linkedin_jobs
    normalize_jobs
    run_monitor
    score_jobs
    summarize_matches
